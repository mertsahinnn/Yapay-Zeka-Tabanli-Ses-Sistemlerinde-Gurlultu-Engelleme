# Buradi parametreleri makalede verilen degerlere gore degistir.


program : sweep_train.py  ## Burayi py dosyasinin konumuna gore degistir
method : bayes
metric :
  name : loss/validation
  goal : minimize
parameters:
  learning_rate:
    distribution : log_uniform_values
    min : 0.00005
    max : 0.001
  dropout_rate:
    distribution : uniform
    min : 0.2
    max : 0.8

early_terminate:
  type : hyperband
  min_iter : 3