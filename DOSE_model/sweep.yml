# Buradi parametreleri makalede verilen degerlere gore degistir.


program : sweep_train.py
method : bayes
metric :
  name : loss/validation
  goal : minimize
parameters:
  learning_rate:
    distribution : log_uniform_values
    min : 0.00005
    max : 0.001
  dropout_rate:
    distribution : uniform
    min : 0.2
    max : 0.8
  step1 : 
    values : [25, 30, 35, 40, 45]
  step2 :
    values : [10, 15, 20, 25]
early_terminate:
  type : hyperband
  min_iter : 3